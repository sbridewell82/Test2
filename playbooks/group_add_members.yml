---
# Add members to an existing group in Netwrix Directory Manager
#
# Required extra-vars:
#   group_identity    - DN or sAMAccountName of the target group
#   group_members     - List of member DNs to add
#                       e.g. ["CN=jdoe,OU=Users,DC=example,DC=com",
#                             "CN=jsmith,OU=Users,DC=example,DC=com"]
#   ndm_username      - NDM service account username
#   ndm_password      - NDM service account password
#   ndm_host          - NDM server hostname/IP
#   ndm_identity_store_id - Identity store ID from NDM admin console

- name: Add members to group in Netwrix Directory Manager
  hosts: localhost
  gather_facts: false

  roles:
    - role: netwrix_dm
      vars:
        ndm_task: group_add_members
