---
# Create a security group in Netwrix Directory Manager
#
# Required extra-vars (set via AAP survey or --extra-vars):
#   group_name        - Display name of the new group
#   group_container   - LDAP OU path, e.g. "OU=Groups,DC=example,DC=com"
#   ndm_username      - NDM service account username
#   ndm_password      - NDM service account password
#   ndm_host          - NDM server hostname/IP
#   ndm_identity_store_id - Identity store ID from NDM admin console
#
# Optional extra-vars:
#   group_description - Group description
#   group_scope       - 0=DomainLocal, 1=Global (default), 2=Universal
#   group_type        - 2=Distribution, 8=Security (default)
#   group_owners      - List of owner DNs, e.g. ["CN=jdoe,OU=Users,DC=example,DC=com"]

- name: Create group in Netwrix Directory Manager
  hosts: localhost
  gather_facts: false

  roles:
    - role: netwrix_dm
      vars:
        ndm_task: group_create
