---
# Connection
ndm_host: "myid.lmc-aero-up.com"
ndm_port: 4443
ndm_validate_certs: true
ndm_client_id: "groupid_resourceowner"
ndm_scope: "groupid_webapp"
ndm_identity_store_id: "1"

# Containers
ndm_default_group_container: "OU=Groups,DC=example,DC=com"
ndm_default_user_container: "OU=Users,DC=example,DC=com"

# Group defaults
ndm_default_group_scope: 1
ndm_default_group_type: 8

# ---- Group operation vars (set via extra-vars or AAP survey) ----
group_name: ""
group_description: ""
group_container: "{{ ndm_default_group_container }}"
group_scope: "{{ ndm_default_group_scope }}"
group_type: "{{ ndm_default_group_type }}"
# group_identity: DN or sAMAccountName of the target group
group_identity: ""
# group_members: list of DN strings  e.g. ["CN=jdoe,OU=Users,DC=example,DC=com"]
group_members: []
# group_owners: list of DN strings
group_owners: []

# ---- User operation vars (set via extra-vars or AAP survey) ----
user_first_name: ""
user_last_name: ""
user_sam_account_name: ""
user_principal_name: ""
user_password: ""
user_container: "{{ ndm_default_user_container }}"
user_description: ""
# user_identity: DN or sAMAccountName of the target user
user_identity: ""
