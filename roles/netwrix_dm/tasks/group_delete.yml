---
- name: Validate required variables for group deletion
  assert:
    that:
      - group_identity | length > 0
    fail_msg: "group_identity (DN or sAMAccountName) must be set"

- name: Delete group from Netwrix Directory Manager
  uri:
    url: "https://{{ ndm_host }}:{{ ndm_port }}/GroupIDDataService/api/IdentityStores/{{ ndm_identity_store_id }}/Groups/{{ group_identity | urlencode }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ ndm_access_token }}"
    validate_certs: "{{ ndm_validate_certs }}"
    status_code: [200, 204]
    timeout: 30
  register: ndm_group_delete_result

- name: Confirm group deletion
  debug:
    msg: "Group '{{ group_identity }}' has been deleted."
