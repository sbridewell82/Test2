---
- name: Validate required variables for removing group members
  assert:
    that:
      - group_identity | length > 0
      - group_members | length > 0
    fail_msg: "group_identity and group_members (non-empty list) must be set"

- name: Remove each member from group in Netwrix Directory Manager
  uri:
    url: "https://{{ ndm_host }}:{{ ndm_port }}/GroupIDDataService/api/IdentityStores/{{ ndm_identity_store_id }}/Groups/{{ group_identity | urlencode }}/Members/{{ item | urlencode }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ ndm_access_token }}"
    validate_certs: "{{ ndm_validate_certs }}"
    status_code: [200, 204]
    timeout: 30
  loop: "{{ group_members }}"
  register: ndm_remove_members_result

- name: Confirm members removed
  debug:
    msg: "Removed {{ group_members | length }} member(s) from group '{{ group_identity }}'."
