---
- name: Validate required variables for setting group owners
  assert:
    that:
      - group_identity | length > 0
      - group_owners | length > 0
    fail_msg: "group_identity and group_owners (non-empty list) must be set"

- name: Set owners on group in Netwrix Directory Manager
  uri:
    url: "https://{{ ndm_host }}:{{ ndm_port }}/GroupIDDataService/api/IdentityStores/{{ ndm_identity_store_id }}/Groups/{{ group_identity | urlencode }}"
    method: PATCH
    headers:
      Authorization: "Bearer {{ ndm_access_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      ManagedByDN: "{{ group_owners }}"
    validate_certs: "{{ ndm_validate_certs }}"
    status_code: [200, 204]
    timeout: 30
  register: ndm_set_owners_result

- name: Confirm owners updated
  debug:
    msg: "Owners updated for group '{{ group_identity }}': {{ group_owners | join(', ') }}"
