---
- name: Validate required variables for user deletion
  assert:
    that:
      - user_identity | length > 0
    fail_msg: "user_identity (DN or sAMAccountName) must be set"

- name: Delete user from Netwrix Directory Manager
  uri:
    url: "https://{{ ndm_host }}:{{ ndm_port }}/GroupIDDataService/api/IdentityStores/{{ ndm_identity_store_id }}/Users/{{ user_identity | urlencode }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ ndm_access_token }}"
    validate_certs: "{{ ndm_validate_certs }}"
    status_code: [200, 204]
    timeout: 30
  register: ndm_user_delete_result

- name: Confirm user deletion
  debug:
    msg: "User '{{ user_identity }}' has been deleted."
