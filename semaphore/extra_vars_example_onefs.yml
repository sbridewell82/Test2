---
# Paste this into Semaphore → Task Template → Extra Variables.
# Values here become the defaults users see when they run the template.
# Override per-run using the "Advanced" run dialog in Semaphore.
#
# TIP: store onefs_password in the Semaphore Key Store (type: secret),
# then reference it as an environment variable rather than putting it here.

# ── Cluster connection ────────────────────────────────────────────────────
onefs_host:     "192.168.1.100"
onefs_username: "admin"
onefs_port:     8080
# onefs_password comes from the Semaphore Key Store — do NOT put it here.

# ── Access zone ───────────────────────────────────────────────────────────
onefs_zone: "System"

# ── Share type ────────────────────────────────────────────────────────────
# smb   → SMB/CIFS share only
# nfs   → NFS export only
# both  → SMB share + NFS export on the same path
share_type: "smb"

# ── Share / export identity ───────────────────────────────────────────────
share_name:        "Finance"           # SMB share name (ignored when share_type is nfs)
share_path:        "/ifs/finance"      # Must start with /ifs
share_description: "Finance department share"

# ── SMB permissions ───────────────────────────────────────────────────────
# type:            user | group | wellknown
# permission:      full | change | read
# permission_type: allow | deny  (default: allow)
share_permissions:
  - name: "CORP\\Finance"
    type: "group"
    permission: "full"
    permission_type: "allow"
  - name: "CORP\\Auditors"
    type: "group"
    permission: "read"
    permission_type: "allow"
  - name: "alice"
    type: "user"
    permission: "full"
    permission_type: "allow"

# ── NFS client controls (only used when share_type is nfs or both) ────────
# Leave a list empty to omit that argument (e.g. nfs_clients: [] means all hosts can mount)
nfs_clients:       []            # mount-allowed hosts/networks (empty = all)
nfs_rw_clients:    ["10.0.0.0/24"]
nfs_ro_clients:    []
nfs_root_clients:  ["10.0.0.5"]
nfs_all_dirs:      false
nfs_no_root_squash: false
